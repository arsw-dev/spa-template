minimumReleaseAge: 4320

shellEmulator: true

trustPolicy: no-downgrade

packages:
  - site

# semver@6.3.1 (pulled in by @babel/core via @vitejs/plugin-react) lacks provenance attestation;
# force 7.x, which has it, to satisfy the no-downgrade trust policy
overrides:
  semver: 7.8.4

catalogs:
  apps:
    '@vitejs/plugin-react': 6.0.2
    vite: 8.0.16

  linting:
    '@antfu/eslint-config': 9.0.0
    '@eslint-react/eslint-plugin': 5.8.19
    eslint: 10.4.1
    eslint-plugin-format: 2.0.1
    eslint-plugin-react-hooks: 7.1.0
    eslint-plugin-react-refresh: 0.5.2

  react:
    '@types/react': 19.2.17
    '@types/react-dom': 19.2.3
    react: 19.2.6
    react-dom: 19.2.6

  tooling:
    '@types/node': 25.9.3
    husky: 9.1.7
    lint-staged: 17.0.7
    typescript: 6.0.3
