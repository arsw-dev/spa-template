name: Deploy

# Build, deploy and smoke test come from spa-platform's reusable workflow, pinned to a commit; the deploy tool runs
# from that same commit.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    uses: arsw-dev/spa-platform/.github/workflows/site-deploy.yml@250ffe0e3f9b2bd5dd168b24f5975f0e01e8ada9 # main
    permissions:
      contents: read
      id-token: write
